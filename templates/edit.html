{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit saved login' if editing else 'Add a saved login' }}</h2>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Title <input name="title" value="{{ fields.get('title', '') }}" maxlength="200" required></label>
  <label>Login name <input name="username" value="{{ fields.get('username', '') }}" maxlength="200" autocomplete="off" required></label>
  <label>Password <input type="password" name="password" value="{{ fields.get('password', '') }}" maxlength="200" autocomplete="off" required></label>
  <button type="submit">Save login</button>
</form>
<p><a href="{{ url_for('items') }}">Cancel</a></p>
{% endblock %}
