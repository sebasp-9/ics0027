{% extends 'base.html' %}
{% block content %}
<h2>{{ fields.title }}</h2>
<p>Login name: {{ fields.username }}</p>
<p>Password: {% if revealed %}<code>{{ fields.password }}</code>{% else %}Hidden{% endif %}</p>
{% if revealed %}<p><a href="{{ url_for('view_item', item_id=item_id, _method='GET') }}">Hide password</a></p>
{% else %}
<form method="post" action="{{ url_for('view_item', item_id=item_id, _method='POST') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button type="submit">Show password</button>
</form>
{% endif %}
<p><a href="{{ url_for('edit_item', item_id=item_id) }}">Edit login</a></p>
<form method="post" action="{{ url_for('delete_item', item_id=item_id) }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label><input type="checkbox" required> I want to permanently delete this login.</label>
  <button type="submit">Delete login</button>
</form>
{% endblock %}
